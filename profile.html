<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile | CP Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --surface: #f8fafc;
            --text: #0f172a;
            --border: #e2e8f0;
            --primary: #3b82f6;
        }

        .dark {
            --bg: #020617;
            --surface: #0f172a;
            --text: #f8fafc;
            --border: #1e293b;
            --primary: #60a5fa;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            transition: background 0.3s, color 0.3s;
        }

        .glass {
            background: rgba(var(--surface), 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>

<body class="min-h-screen p-6 md:p-12 bg-[radial-gradient(circle_at_bottom_left,_var(--primary)_0%,_transparent_20%)]">

    <div class="max-w-2xl mx-auto">
        <div class="flex items-center justify-between mb-12">
            <a href="index.html" class="text-slate-500 hover:text-blue-500 transition flex items-center gap-2">
                <span>←</span> Back to Dashboard
            </a>
            <div class="flex items-center gap-4">
                <button onclick="logout()"
                    class="text-red-500 hover:bg-red-500/10 px-4 py-2 rounded-xl text-sm font-bold transition">Sign
                    Out</button>
                <h1 class="text-2xl font-black mono text-blue-500 uppercase">Profile</h1>
            </div>
        </div>

        <div class="glass p-10 rounded-3xl shadow-2xl mb-8">
            <h3 class="text-xl font-bold mono text-blue-500 mb-6 uppercase">General Info</h3>
            <form id="profile-form" class="space-y-6">
                <div class="flex flex-col items-center gap-4 mb-8">
                    <img id="profile-img-preview" src="https://ui-avatars.com/api/?name=User"
                        class="w-32 h-32 rounded-full border-4 border-blue-500/20 object-cover shadow-xl">
                    <input type="text" id="profile-pic-url" placeholder="Paste Image URL"
                        class="w-full max-w-xs p-2 text-xs text-center rounded-lg bg-slate-100 dark:bg-slate-900 border-none outline-none">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="text-xs font-bold uppercase tracking-widest text-slate-500 ml-1">Full Name</label>
                        <input type="text" id="profile-name" required
                            class="w-full p-4 rounded-xl bg-slate-100 dark:bg-slate-900 border border-transparent focus:border-blue-500 outline-none">
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs font-bold uppercase tracking-widest text-slate-500 ml-1">Username</label>
                        <input type="text" id="profile-username" required
                            class="w-full p-4 rounded-xl bg-slate-100 dark:bg-slate-900 border border-transparent focus:border-blue-500 outline-none">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-widest text-slate-500 ml-1">Institution</label>
                    <input type="text" id="profile-institution" placeholder="University or Organization"
                        class="w-full p-4 rounded-xl bg-slate-100 dark:bg-slate-900 border border-transparent focus:border-blue-500 outline-none">
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-widest text-slate-500 ml-1">Date of Birth</label>
                    <input type="date" id="profile-dob"
                        class="w-full p-4 rounded-xl bg-slate-100 dark:bg-slate-900 border border-transparent focus:border-blue-500 outline-none">
                </div>

                <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-500 text-white py-4 rounded-xl font-bold shadow-lg shadow-blue-500/20 transition transform active:scale-[0.98]">
                    Save Profile Changes
                </button>
            </form>
        </div>

        <div class="glass p-10 rounded-3xl shadow-2xl border-t-2 border-t-red-500/10">
            <h3 class="text-xl font-bold mono text-red-500 mb-6 uppercase">Account & Security</h3>

            <div class="space-y-8">
                <div class="p-6 rounded-2xl bg-slate-100 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800">
                    <h4 class="text-sm font-bold uppercase tracking-widest mb-4">Update Password</h4>
                    <div class="flex flex-col md:flex-row gap-3">
                        <input type="password" id="new-password" placeholder="New Password"
                            class="flex-grow p-4 rounded-xl bg-white dark:bg-slate-950 border border-transparent focus:border-blue-500 outline-none">
                        <button onclick="updatePasswordHandler()"
                            class="bg-blue-600 hover:bg-blue-500 text-white px-8 py-4 rounded-xl font-bold transition">Update</button>
                    </div>
                </div>

                <div class="p-6 rounded-2xl bg-red-500/5 border border-red-500/20">
                    <h4 class="text-sm font-bold uppercase tracking-widest text-red-500 mb-6">Danger Zone</h4>
                    
                    <div class="mb-6">
                        <label class="text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-2 block">Current Password (Required for Reset/Delete)</label>
                        <input type="password" id="confirm-password" placeholder="Confirm your password"
                            class="w-full p-4 rounded-xl bg-white dark:bg-slate-950 border border-transparent focus:border-red-500 outline-none">
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="space-y-2">
                            <p class="text-[10px] text-slate-500 px-1">Wipes all CP logs, charts, and streaks.</p>
                            <button onclick="resetDataHandler()"
                                class="w-full bg-orange-600/10 hover:bg-orange-600 text-orange-600 hover:text-white border border-orange-600 py-3 rounded-xl font-bold transition text-sm">
                                Reset All Progress
                            </button>
                        </div>
                        
                        <div class="space-y-2">
                            <p class="text-[10px] text-slate-500 px-1">Permanently removes your account.</p>
                            <button onclick="deleteAccountHandler()"
                                class="w-full bg-red-600/10 hover:bg-red-600 text-red-600 hover:text-white border border-red-600 py-3 rounded-xl font-bold transition text-sm">
                                Delete Account
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="profile-logic.js"></script>
</body>

</html>
