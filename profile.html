<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings | CP Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=JetBrains+Mono:wght@500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --surface: #f3f4f6;
            --text: #1f2937;
            --primary: #2563eb;
        }

        .dark {
            --bg: #0b0f1a;
            --surface: #161b2c;
            --text: #f3f4f6;
            --primary: #3b82f6;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: all 0.3s ease;
        }

        .glass-card {
            background: rgba(var(--surface), 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 32px;
        }

        .input-field {
            background: rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .dark .input-field {
            background: rgba(255, 255, 255, 0.03);
        }

        .input-field:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>

<body class="min-h-screen p-4 md:p-8 bg-[radial-gradient(circle_at_top_right,_var(--primary)_0%,_transparent_25%)]">

    <div class="max-w-5xl mx-auto">
        <header class="mb-10">
            <div class="flex justify-between items-center mb-4">
                <a href="index.html"
                    class="text-sm font-bold text-blue-500 hover:text-blue-400 flex items-center gap-2 transition">
                    <span>←</span> Return to Dashboard
                </a>
                <button onclick="logout()"
                    class="px-6 py-3 rounded-2xl bg-red-500/10 text-red-500 font-bold hover:bg-red-500 hover:text-white transition">
                    Sign Out
                </button>
            </div>
            <div class="text-center">
                <h1 class="text-4xl font-black tracking-tight">Account <span class="text-blue-500">Settings</span></h1>
            </div>
        </header>

        <div class="grid grid-cols-12 gap-8">
            <div class="col-span-12 lg:col-span-4 space-y-6">
                <div class="glass-card p-8 text-center relative overflow-hidden">
                    <div class="relative z-10">
                        <div class="relative inline-block mb-6">
                            <img id="profile-img-preview" src="https://ui-avatars.com/api/?name=User"
                                class="w-32 h-32 rounded-3xl object-cover border-4 border-blue-500/20 shadow-2xl mx-auto">
                            <div class="absolute -bottom-2 -right-2 bg-blue-600 p-2 rounded-xl text-white shadow-lg">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3"
                                        d="M12 4v16m8-8H4" />
                                </svg>
                            </div>
                        </div>
                        <h2 id="display-name" class="text-2xl font-black mb-1">...</h2>
                        <p id="display-username" class="text-sm text-slate-500 mono mb-6">@username</p>

                        <div class="space-y-2 text-left">
                            <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Profile Image
                                URL</label>
                            <input type="text" id="profile-pic-url" placeholder="Paste URL here..."
                                class="w-full p-3 rounded-xl input-field outline-none text-xs">
                        </div>
                    </div>
                </div>

                <div class="glass-card p-6 bg-blue-600/5 border-blue-500/20">
                    <h3 class="text-xs font-black uppercase text-blue-500 mb-3 tracking-widest">Security Tip</h3>
                    <p class="text-xs text-slate-500 leading-relaxed">Ensure your password is at least 8 characters long
                        and includes numbers for better protection of your CP logs.</p>
                </div>
            </div>

            <div class="col-span-12 lg:col-span-8 space-y-8">
                <div class="glass-card p-10">
                    <div class="flex items-center gap-3 mb-8">
                        <div class="w-2 h-8 bg-blue-600 rounded-full"></div>
                        <h3 class="text-xl font-bold">General Information</h3>
                    </div>

                    <form id="profile-form" class="space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="space-y-2">
                                <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Full Name</label>
                                <input type="text" id="profile-name" required
                                    class="w-full p-4 rounded-2xl input-field outline-none">
                            </div>
                            <div class="space-y-2">
                                <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Username</label>
                                <input type="text" id="profile-username" required
                                    class="w-full p-4 rounded-2xl input-field outline-none">
                            </div>
                        </div>

                        <div class="space-y-2">
                            <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Institution</label>
                            <input type="text" id="profile-institution" placeholder="e.g. Stanford University"
                                class="w-full p-4 rounded-2xl input-field outline-none">
                        </div>

                        <div class="space-y-2">
                            <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Date of Birth</label>
                            <input type="date" id="profile-dob" class="w-full p-4 rounded-2xl input-field outline-none">
                        </div>

                        <button type="submit"
                            class="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white rounded-2xl font-black shadow-lg shadow-blue-900/20 transition transform active:scale-[0.98]">
                            Save Profile Changes
                        </button>
                    </form>
                </div>

                <div class="glass-card p-10 border-t-4 border-red-500/20">
                    <div class="flex items-center gap-3 mb-8">
                        <div class="w-2 h-8 bg-red-600 rounded-full"></div>
                        <h3 class="text-xl font-bold">Security & Privacy</h3>
                    </div>

                    <div class="space-y-8">
                        <div class="space-y-3">
                            <label class="text-[10px] font-black uppercase text-slate-400 ml-1">New Password</label>
                            <div class="flex flex-col md:flex-row gap-3">
                                <input type="password" id="new-password" placeholder="At least 6 characters"
                                    class="flex-grow p-4 rounded-2xl input-field outline-none">
                                <button onclick="updatePasswordHandler()"
                                    class="px-8 py-4 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl font-bold hover:bg-blue-600 hover:text-white hover:border-blue-600 transition">
                                    Update
                                </button>
                            </div>
                        </div>

                        <hr class="opacity-5">

                        <div class="p-6 rounded-3xl bg-red-500/5 border border-red-500/10">
                            <h4 class="text-sm font-black text-red-500 uppercase tracking-widest mb-4">Danger Zone</h4>

                            <div class="mb-6">
                                <label class="text-[10px] font-bold uppercase text-slate-400 mb-2 block">Confirm
                                    Password to Proceed</label>
                                <input type="password" id="confirm-password" placeholder="Verify identity"
                                    class="w-full p-4 rounded-2xl input-field outline-none border-red-500/10 focus:border-red-500">
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <button onclick="resetDataHandler()"
                                    class="p-4 rounded-2xl border-2 border-orange-500/50 text-orange-500 font-bold hover:bg-orange-500 hover:text-white transition">
                                    Wipe All Progress
                                </button>
                                <button onclick="deleteAccountHandler()"
                                    class="p-4 rounded-2xl bg-red-600 text-white font-bold hover:bg-red-500 shadow-lg shadow-red-900/20 transition">
                                    Delete Account
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="profile-logic.js"></script>
</body>

</html>
