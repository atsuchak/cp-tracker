<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CP Tracker | Dev Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .hidden { display: none; }
    </style>
</head>
<body class="min-h-screen">

    <section id="auth-view" class="flex items-center justify-center min-h-screen p-4">
        <div class="glass p-8 rounded-2xl w-full max-w-md shadow-2xl">
            <h1 class="text-3xl font-bold mb-2 mono text-blue-400">./track_cp</h1>
            <p class="text-slate-400 mb-8">Log your grind. Visualize progress.</p>
            
            <div id="auth-form" class="space-y-4">
                <input type="email" id="email" placeholder="Email" class="w-full p-3 rounded bg-slate-900 border border-slate-700 focus:border-blue-500 outline-none">
                <input type="password" id="password" placeholder="Password" class="w-full p-3 rounded bg-slate-900 border border-slate-700 focus:border-blue-500 outline-none">
                <button onclick="handleEmailAuth()" id="primary-auth-btn" class="w-full bg-blue-600 hover:bg-blue-700 py-3 rounded font-semibold transition">Login</button>
                <div class="relative flex py-3 items-center">
                    <div class="flex-grow border-t border-slate-700"></div>
                    <span class="flex-shrink mx-4 text-slate-500 text-sm">OR</span>
                    <div class="flex-grow border-t border-slate-700"></div>
                </div>
                <button onclick="handleGoogleAuth()" class="w-full bg-slate-100 text-slate-900 hover:bg-white py-3 rounded font-semibold flex items-center justify-center gap-2 transition">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/layout/google.svg" width="20"> Continue with Google
                </button>
            </div>
            <p class="mt-6 text-center text-sm text-slate-400">
                <span id="auth-toggle-text">Don't have an account?</span>
                <button onclick="toggleAuthMode()" class="text-blue-400 hover:underline ml-1" id="auth-toggle-btn">Sign Up</button>
            </p>
        </div>
    </section>

    <section id="app-view" class="hidden">
        <nav class="border-b border-slate-800 p-4 sticky top-0 bg-slate-950/80 backdrop-blur-md z-50">
            <div class="max-w-7xl mx-auto flex justify-between items-center">
                <span class="mono text-xl font-bold text-blue-400">CP_TRACKER_V1</span>
                <div class="flex gap-4 items-center">
                    <button onclick="showSection('add-log')" class="bg-blue-600 px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-500">+ Log Daily</button>
                    <button onclick="logout()" class="text-slate-400 hover:text-white text-sm">Logout</button>
                </div>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto p-4 md:p-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="glass p-6 rounded-xl">
                    <p class="text-slate-400 text-sm">Today</p>
                    <h2 id="stat-today" class="text-4xl font-bold mono">0</h2>
                </div>
                <div class="glass p-6 rounded-xl">
                    <p class="text-slate-400 text-sm">Last 7 Days</p>
                    <h2 id="stat-week" class="text-4xl font-bold mono">0</h2>
                </div>
                <div class="glass p-6 rounded-xl border-l-4 border-orange-500">
                    <p class="text-slate-400 text-sm">Current Streak</p>
                    <h2 id="stat-streak" class="text-4xl font-bold mono">0🔥</h2>
                </div>
            </div>

            <div id="dashboard-section" class="space-y-8">
                <div class="glass p-6 rounded-xl h-96">
                    <h3 class="mb-4 font-semibold">Activity Trend</h3>
                    <canvas id="lineChart"></canvas>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="glass p-6 rounded-xl h-80">
                        <h3 class="mb-4 font-semibold">Topic Distribution</h3>
                        <canvas id="barChart"></canvas>
                    </div>
                    <div class="glass p-6 rounded-xl h-80">
                        <h3 class="mb-4 font-semibold">Difficulty Ratio</h3>
                        <canvas id="doughnutChart"></canvas>
                    </div>
                </div>
            </div>

            <div id="add-log-view" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-[100]">
                <div class="glass p-8 rounded-2xl w-full max-w-lg">
                    <div class="flex justify-between mb-6">
                        <h2 class="text-2xl font-bold">Add Daily Log</h2>
                        <button onclick="showSection('dashboard')" class="text-slate-400 hover:text-white">✕</button>
                    </div>
                    <form id="log-form" class="space-y-4">
                        <input type="date" id="log-date" required class="w-full p-3 rounded bg-slate-900 border border-slate-700">
                        <select id="log-platform" class="w-full p-3 rounded bg-slate-900 border border-slate-700">
                            <option>LeetCode</option>
                            <option>Codeforces</option>
                            <option>AtCoder</option>
                        </select>
                        <input type="number" id="log-count" placeholder="Problems Solved" required class="w-full p-3 rounded bg-slate-900 border border-slate-700">
                        <select id="log-diff" class="w-full p-3 rounded bg-slate-900 border border-slate-700">
                            <option>Easy</option>
                            <option>Medium</option>
                            <option>Hard</option>
                        </select>
                        <input type="text" id="log-topics" placeholder="Topics (comma separated: DP, Graphs)" class="w-full p-3 rounded bg-slate-900 border border-slate-700">
                        <button type="submit" class="w-full bg-green-600 hover:bg-green-700 py-3 rounded font-semibold transition">Save Entry</button>
                    </form>
                </div>
            </div>
        </main>
    </section>

    <script type="module" src="app.js"></script>
</body>
</html>
