<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CP Tracker | Modern Dev</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;600;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --surface: #f8fafc;
            --text: #0f172a;
            --border: #e2e8f0;
            --primary: #3b82f6;
        }

        .dark {
            --bg: #020617;
            --surface: #0f172a;
            --text: #f8fafc;
            --border: #1e293b;
            --primary: #60a5fa;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            transition: background 0.3s, color 0.3s;
            font-family: 'Inter', sans-serif;
        }

        .glass {
            background: rgba(var(--surface), 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
        }

        .card-hover:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        input,
        select {
            transition: all 0.2s ease;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body class="min-h-screen">
    <div class="fixed bottom-6 right-6 z-[100]">
        <button onclick="toggleTheme()"
            class="p-4 rounded-full glass shadow-2xl hover:scale-110 active:scale-95 transition">
            <span id="theme-icon">☀️</span>
        </button>
    </div>

    <section id="auth-view"
        class="flex items-center justify-center min-h-screen p-6 bg-[radial-gradient(circle_at_top_right,_var(--primary)_0%,_transparent_25%)]">
        <div class="glass p-10 rounded-3xl w-full max-w-md shadow-2xl border-t-2 border-t-blue-500/20">
            <div class="text-center mb-10">
                <h1 class="text-4xl font-black tracking-tighter mono text-blue-500">CP_TRACK</h1>
                <p class="text-slate-500 dark:text-slate-400 mt-2">Elevate your competitive edge.</p>
            </div>

            <div id="auth-form" class="space-y-4">
                <input type="email" id="email" placeholder="Email address"
                    class="w-full p-4 rounded-xl bg-slate-100 dark:bg-slate-900 border border-transparent focus:border-blue-500 outline-none">
                <input type="password" id="password" placeholder="Password"
                    class="w-full p-4 rounded-xl bg-slate-100 dark:bg-slate-900 border border-transparent focus:border-blue-500 outline-none">
                <button onclick="handleEmailAuth()" id="primary-auth-btn"
                    class="w-full bg-blue-600 hover:bg-blue-500 text-white py-4 rounded-xl font-bold shadow-lg shadow-blue-500/20 transition">Login</button>

                <div class="relative flex py-4 items-center">
                    <div class="flex-grow border-t border-slate-200 dark:border-slate-800"></div>
                    <span class="flex-shrink mx-4 text-slate-400 text-xs font-bold uppercase tracking-widest">or</span>
                    <div class="flex-grow border-t border-slate-200 dark:border-slate-800"></div>
                </div>

                <button onclick="handleGoogleAuth()"
                    class="w-full glass py-4 rounded-xl font-semibold flex items-center justify-center gap-3 hover:bg-slate-50 dark:hover:bg-slate-800 transition">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/layout/google.svg" width="18"> Continue
                    with Google
                </button>
            </div>
            <p class="mt-8 text-center text-sm text-slate-500">
                <span id="auth-toggle-text">Don't have an account?</span>
                <button onclick="toggleAuthMode()" class="text-blue-500 font-bold hover:underline ml-1"
                    id="auth-toggle-btn">Sign Up</button>
            </p>
        </div>
    </section>

    <section id="app-view" class="hidden">
        <nav
            class="border-b border-slate-200 dark:border-slate-800 p-5 sticky top-0 bg-white/80 dark:bg-slate-950/80 backdrop-blur-xl z-50">
            <div class="max-w-7xl mx-auto flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <div
                        class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold mono">
                        C</div>
                    <span class="mono font-bold tracking-tight">DASHBOARD</span>
                </div>
                <div class="flex gap-6 items-center">
                    <div class="relative group">
                        <button class="text-slate-500 hover:text-blue-500 text-sm font-medium flex items-center gap-1">
                            Judges <span class="text-[10px]">▼</span>
                        </button>
                        <div
                            class="absolute right-0 mt-2 w-48 glass rounded-xl shadow-xl hidden group-hover:block z-[60] overflow-hidden">
                            <a href="https://codeforces.com" target="_blank"
                                class="block px-4 py-2 text-sm hover:bg-blue-500/10 transition">Codeforces</a>
                            <a href="https://leetcode.com" target="_blank"
                                class="block px-4 py-2 text-sm hover:bg-blue-500/10 transition">LeetCode</a>
                            <a href="https://atcoder.jp" target="_blank"
                                class="block px-4 py-2 text-sm hover:bg-blue-500/10 transition">AtCoder</a>
                            <a href="https://www.codechef.com" target="_blank"
                                class="block px-4 py-2 text-sm hover:bg-blue-500/10 transition">CodeChef</a>
                            <a href="https://cses.fi/problemset/" target="_blank"
                                class="block px-4 py-2 text-sm hover:bg-blue-500/10 transition">CSES</a>
                        </div>
                    </div>
                    <button onclick="showSection('profile')"
                        class="w-10 h-10 rounded-full border border-slate-200 dark:border-slate-800 overflow-hidden hover:border-blue-500 transition">
                        <img id="nav-avatar" src="https://ui-avatars.com/api/?name=User&background=random"
                            class="w-full h-full object-cover">
                    </button>
                    
                    <button onclick="showSection('add-log')"
                        class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2.5 rounded-full text-sm font-bold shadow-lg shadow-blue-500/20 transition">+
                        New Log</button>
                    <button onclick="logout()"
                        class="text-slate-500 hover:text-red-500 transition-colors text-sm font-medium">Sign
                        Out</button>
                </div>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto p-6 md:p-12">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-16">
                <div class="glass p-8 rounded-3xl card-hover">
                    <div class="flex justify-between items-start mb-4">
                        <span class="text-slate-500 text-xs font-bold uppercase tracking-widest">Today</span>
                        <span class="text-blue-500 text-xl">↗</span>
                    </div>
                    <h2 id="stat-today" class="text-5xl font-black mono">0</h2>
                    <p class="text-slate-400 text-sm mt-2 italic">problems solved</p>
                </div>
                <div class="glass p-8 rounded-3xl card-hover">
                    <div class="flex justify-between items-start mb-4">
                        <span class="text-slate-500 text-xs font-bold uppercase tracking-widest">7 Days</span>
                        <span class="text-purple-500 text-xl">📊</span>
                    </div>
                    <h2 id="stat-week" class="text-5xl font-black mono">0</h2>
                    <p class="text-slate-400 text-sm mt-2 italic">weekly total</p>
                </div>
                <div class="glass p-8 rounded-3xl card-hover border-r-4 border-r-orange-500">
                    <div class="flex justify-between items-start mb-4">
                        <span class="text-slate-500 text-xs font-bold uppercase tracking-widest">Streak</span>
                        <span id="streak-icon" class="text-xl">🔥</span>
                    </div>
                    <h2 id="stat-streak" class="text-5xl font-black mono">0</h2>
                    <p class="text-slate-400 text-sm mt-2 italic">consecutive days</p>
                </div>
            </div>

            <div class="grid grid-cols-12 gap-8">
                <div class="col-span-12 lg:col-span-8 glass p-8 rounded-3xl overflow-hidden">
                    <h3 class="font-bold text-lg mb-8">Activity Pipeline</h3>
                    <div class="relative h-[350px] w-full"> <canvas id="lineChart"></canvas>
                    </div>
                </div>

                <div class="col-span-12 lg:col-span-4 flex flex-col gap-8">
                    <div class="glass p-8 rounded-3xl overflow-hidden">
                        <h3 class="font-bold text-xs uppercase tracking-widest text-slate-500 mb-6">Difficulty</h3>
                        <div class="relative h-[220px] w-full"> <canvas id="doughnutChart"></canvas>
                        </div>
                    </div>
                    <div class="glass p-8 rounded-3xl overflow-hidden">
                        <h3 class="font-bold text-xs uppercase tracking-widest text-slate-500 mb-6">Topics</h3>
                        <div class="relative h-[220px] w-full"> <canvas id="barChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </section>

    <div id="add-log-view"
        class="hidden fixed inset-0 bg-slate-950/40 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
        <div class="glass p-8 rounded-3xl w-full max-w-lg shadow-2xl scale-in">
            <div class="flex justify-between mb-8">
                <h2 class="text-2xl font-bold mono">LOG_PROGRESS</h2>
                <button onclick="showSection('dashboard')"
                    class="text-slate-400 hover:text-red-500 transition">✕</button>
            </div>
            <form id="log-form" class="space-y-5">
                <div class="grid grid-cols-2 gap-4">
                    <input type="date" id="log-date" required
                        class="p-4 rounded-xl bg-slate-100 dark:bg-slate-900 border border-transparent focus:border-blue-500 outline-none">
                    <select id="log-platform"
                        class="p-4 rounded-xl bg-slate-100 dark:bg-slate-900 border border-transparent focus:border-blue-500 outline-none">
                        <option>LeetCode</option>
                        <option>Codeforces</option>
                        <option>AtCoder</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <input type="number" id="log-count" placeholder="Count" required
                        class="p-4 rounded-xl bg-slate-100 dark:bg-slate-900 border border-transparent focus:border-blue-500 outline-none">
                    <select id="log-diff"
                        class="p-4 rounded-xl bg-slate-100 dark:bg-slate-900 border border-transparent focus:border-blue-500 outline-none">
                        <option>Easy</option>
                        <option>Medium</option>
                        <option>Hard</option>
                    </select>
                </div>
                <input type="text" id="log-topics" placeholder="Topics (e.g. DP, Graphs)"
                    class="w-full p-4 rounded-xl bg-slate-100 dark:bg-slate-900 border border-transparent focus:border-blue-500 outline-none">
                <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-500 text-white py-4 rounded-xl font-bold shadow-lg shadow-blue-500/20 transition">Commit
                    Log</button>
            </form>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>

</html>
